[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "pyproject-manager"
dynamic = ["version"]
description = "PyForge — Python project manager, a powerful complement to uv"
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
keywords = ["python", "project-manager", "uv", "cli", "rust"]

[project.urls]
Homepage = "https://github.com/HyunLim0815/pyforge"
Repository = "https://github.com/HyunLim0815/pyforge"
Issues = "https://github.com/HyunLim0815/pyforge/issues"

[tool.maturin]
bindings = "bin"
