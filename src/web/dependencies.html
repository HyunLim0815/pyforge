<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyForge - Dependencies</title>
<style>
:root{--bg:#0f172a;--card-bg:#1e293b;--border:#334155;--text:#e2e8f0;--text-muted:#94a3b8;--text-dim:#64748b;--accent:#38bdf8;--accent-hover:#7dd3fc;--bar-track:#334155;--input-bg:#1e293b;--input-border:#475569;--hover-bg:#263348;--badge-bg:#0c4a6e;--badge-text:#7dd3fc}
[data-theme="light"]{--bg:#f8fafc;--card-bg:#ffffff;--border:#e2e8f0;--text:#1e293b;--text-muted:#475569;--text-dim:#64748b;--accent:#0284c7;--accent-hover:#0369a1;--bar-track:#e2e8f0;--input-bg:#ffffff;--input-border:#cbd5e1;--hover-bg:#f1f5f9;--badge-bg:#e0f2fe;--badge-text:#0369a1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:2rem;min-height:100vh;transition:background 0.2s,color 0.2s}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
h1{font-size:1.5rem;color:var(--accent)}
.nav{display:flex;gap:1rem;align-items:center}
.nav a{color:var(--text-muted);text-decoration:none;font-size:0.875rem;transition:color 0.15s}
.nav a:hover{color:var(--accent)}
.nav-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text);padding:0.4rem 0.75rem;border-radius:6px;cursor:pointer;font-size:0.875rem;transition:background 0.15s}
.nav-btn:hover{background:var(--hover-bg)}
.search-box{margin-bottom:1rem}
.search-box input{width:100%;max-width:400px;padding:0.5rem 0.75rem;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:6px;font-size:0.875rem;outline:none;transition:border-color 0.15s}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text-dim)}
.card{background:var(--card-bg);border-radius:8px;padding:1.5rem;margin-bottom:1rem;transition:background 0.2s}
.card h2{font-size:0.875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.75rem}
.dep-table{width:100%;border-collapse:collapse}
.dep-table th{text-align:left;padding:0.5rem 0.75rem;color:var(--text-muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;border-bottom:2px solid var(--border)}
.dep-table td{padding:0.5rem 0.75rem;border-bottom:1px solid var(--border);font-size:0.875rem;vertical-align:top}
.dep-table tr:hover td{background:var(--hover-bg)}
.dep-name{font-weight:600;color:var(--text)}
.dep-count{color:var(--accent);font-weight:700;font-size:1rem;text-align:center}
.dep-projects{color:var(--text-muted);font-size:0.8rem;line-height:1.6}
.dep-projects span{display:inline-block;background:var(--badge-bg);color:var(--badge-text);padding:0.1rem 0.5rem;border-radius:4px;margin:0.15rem 0.2rem;font-size:0.75rem}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.summary .card{margin-bottom:0}
.summary .value{font-size:2rem;font-weight:700;color:var(--accent)}
.empty{color:var(--text-dim);text-align:center;padding:2rem;font-style:italic}
.loading{color:var(--text-dim);text-align:center;padding:2rem;font-style:italic}
.error{color:#f87171;text-align:center;padding:2rem}
.no-results{color:var(--text-dim);text-align:center;padding:1.5rem;font-size:0.875rem}
</style>
</head>
<body>
<div class="top-bar">
<h1 data-i18n="deps.title">Dependencies</h1>
<div class="nav">
<a href="/" data-i18n="nav.dashboard">Dashboard</a>
<a href="/projects" data-i18n="nav.projects">Projects</a>
<button class="nav-btn" id="themeToggle" title="Toggle theme">Light</button>
<button class="nav-btn" id="langToggle" title="Switch language">EN</button>
</div>
</div>
<div id="summary" class="summary"></div>
<div class="card">
<h2 data-i18n="deps.cross_project">Cross-Project Dependencies</h2>
<div class="search-box">
<input type="text" id="searchInput" data-i18n="deps.search" placeholder="Search dependencies...">
</div>
<div id="content"><p class="loading" data-i18n="deps.loading">Loading...</p></div>
</div>
<script src="/i18n.js"></script>
<script>
(function(){
  // Theme
  var saved_theme = localStorage.getItem('pyforge_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved_theme);
  var themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pyforge_theme', next);
    themeBtn.textContent = next === 'dark' ? PyForgeI18n.t('theme.light') : PyForgeI18n.t('theme.dark');
  });

  // i18n
  PyForgeI18n.initI18n();
  themeBtn.textContent = saved_theme === 'dark' ? PyForgeI18n.t('theme.light') : PyForgeI18n.t('theme.dark');

  var I = PyForgeI18n;
  var contentEl = document.getElementById('content');
  var summaryEl = document.getElementById('summary');
  var searchInput = document.getElementById('searchInput');
  var allData = null;

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  fetch('/api/dependencies')
    .then(function(r){ return r.json(); })
    .then(function(data){
      allData = data;
      renderSummary(data);
      renderTable(data, '');
    })
    .catch(function(e){
      contentEl.innerHTML = '<p class="error">' + I.t('deps.error') + e.message + '</p>';
    });

  document.addEventListener('localeChanged', function(){
    if (allData) {
      renderSummary(allData);
      renderTable(allData, searchInput.value);
    }
  });

  function renderSummary(data) {
    var keys = Object.keys(data.dependencies || {});
    var totalDeps = keys.length;
    var totalProjects = 0;
    var seen = {};
    for (var i = 0; i < keys.length; i++) {
      var projects = data.dependencies[keys[i]].projects;
      for (var j = 0; j < projects.length; j++) {
        if (!seen[projects[j]]) { seen[projects[j]] = true; totalProjects++; }
      }
    }
    var shared = 0;
    for (var i = 0; i < keys.length; i++) {
      if (data.dependencies[keys[i]].count > 1) shared++;
    }
    summaryEl.innerHTML =
      '<div class="card"><h2>' + I.t('deps.total') + '</h2><div class="value">' + totalDeps + '</div></div>' +
      '<div class="card"><h2>' + I.t('deps.covered') + '</h2><div class="value">' + totalProjects + '</div></div>' +
      '<div class="card"><h2>' + I.t('deps.shared') + '</h2><div class="value">' + shared + '</div></div>';
  }

  function renderTable(data, query) {
    var deps = data.dependencies || {};
    var keys = Object.keys(deps);
    if (query) {
      var q = query.toLowerCase();
      keys = keys.filter(function(k){ return k.toLowerCase().indexOf(q) !== -1; });
    }
    if (keys.length === 0) {
      contentEl.innerHTML = '<p class="no-results">' + (query ? I.t('deps.no_match') : I.t('deps.empty')) + '</p>';
      return;
    }
    var html = '<table class="dep-table">';
    html += '<thead><tr><th>' + I.t('deps.col_name') + '</th><th style="text-align:center;width:60px">' + I.t('deps.col_count') + '</th><th>' + I.t('deps.col_projects') + '</th></tr></thead><tbody>';
    for (var i = 0; i < keys.length; i++) {
      var name = keys[i];
      var info = deps[name];
      var projectBadges = info.projects.map(function(p){
        return '<span>' + escapeHtml(p) + '</span>';
      }).join('');
      html += '<tr>';
      html += '<td class="dep-name">' + escapeHtml(name) + '</td>';
      html += '<td class="dep-count">' + info.count + '</td>';
      html += '<td class="dep-projects">' + projectBadges + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    contentEl.innerHTML = html;
  }

  var debounceTimer = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(debounceTimer);
    var q = searchInput.value;
    debounceTimer = setTimeout(function(){
      if (allData) renderTable(allData, q);
    }, 200);
  });
})();
</script>
</body>
</html>
